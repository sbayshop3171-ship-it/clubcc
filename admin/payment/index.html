<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Management | clubcc. Market</title>
    <link rel="shortcut icon" href="/images/main-logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="/admin/session-timeout.js" defer></script>
    <script src="/admin/payment/payment.js" defer></script>
</head>

<body class="admin-payment-page">
    <main class="admin-payment-shell">
        <aside class="admin-payment-sidebar" aria-label="Admin navigation">
            <a class="brand" href="/admin"><span class="brand-mark">CC</span><span>clubcc. Market</span></a>
            <nav>
                <a href="/admin"><iconify-icon icon="mdi:view-dashboard-outline" width="18" height="18"></iconify-icon>Dashboard</a>
                <a href="/admin/users"><iconify-icon icon="mdi:account-group-outline" width="18" height="18"></iconify-icon>Users</a>
                <a href="/admin/cards"><iconify-icon icon="mdi:credit-card-chip-outline" width="18" height="18"></iconify-icon>Cards</a>
                <a href="/admin/payment#methods" class="is-active" data-payment-view="methods" aria-current="page"><iconify-icon icon="mdi:cash-multiple" width="18" height="18"></iconify-icon>Payment Methods</a>
                <a href="/admin/payment#requests" data-payment-view="requests"><iconify-icon icon="mdi:clipboard-text-clock-outline" width="18" height="18"></iconify-icon>Deposit Requests</a>
                <a href="/dashboard/"><iconify-icon icon="mdi:open-in-new" width="18" height="18"></iconify-icon>User dashboard</a>
            </nav>
        </aside>
        <section class="admin-payment-main">
            <header class="admin-payment-topbar glass-panel">
                <div><span class="admin-kicker">Admin Panel</span><h1>Payment</h1></div>
                <div class="admin-header-actions"><button class="admin-button" id="logoutButton" type="button">Logout</button></div>
            </header>
            <div class="admin-payment-content">
                <section class="ticker-admin-card card card-bordered nk-block dashboard-module" id="paymentMethodsView" aria-labelledby="gatewayTitle">
                    <div class="section-heading"><h2 id="gatewayTitle">Payment Gateways</h2></div>
                    <form id="paymentSettingsForm" class="payment-settings-form">
                        <div class="settings-grid settings-grid-compact">
                            <label>Master Admin Key<input class="form-control" id="masterAdminKey" type="password" autocomplete="off" required></label>
                            <div class="settings-actions"><button class="admin-button btn" id="unlockPaymentSettings" type="button">Unlock</button></div>
                        </div>
                        <div class="settings-grid settings-grid-compact">
                            <label>Minimum deposit ($)<input class="form-control" id="minimumDepositInput" data-payment-lock type="number" min="0" step="0.01" disabled></label>
                            <label>Payment window (minutes)<input class="form-control" id="paymentWindowInput" data-payment-lock type="number" min="5" max="180" disabled></label>
                        </div>
                        <div id="adminPaymentMethods" class="admin-payment-methods"></div>
                        <div class="settings-actions"><button class="admin-button admin-button-primary btn btn-primary" id="savePaymentSettings" data-payment-lock type="submit" disabled>Save Settings</button><button class="admin-button btn" id="addPaymentMethod" data-payment-lock type="button" disabled>Add gateway</button></div>
                        <p class="settings-status" id="paymentSettingsStatus">Loading</p>
                    </form>
                </section>
                <section class="ticker-admin-card card card-bordered nk-block dashboard-module" id="depositRequestsView" aria-labelledby="requestsTitle">
                    <div class="section-heading"><h2 id="requestsTitle">Deposit Requests</h2><button class="admin-button btn" id="refreshDeposits" type="button">Refresh</button></div>
                    <div class="table-scroll"><table class="deposit-table admin-deposit-table"><thead><tr><th>User Email / ID</th><th>Amount ($)</th><th>Method</th><th>TxID / Screenshot</th><th>Submitted Date</th><th>Status</th><th>Actions</th></tr></thead><tbody id="adminDepositBody"><tr><td colspan="7" class="empty-history">Loading requests...</td></tr></tbody></table></div>
                </section>
            </div>
        </section>
    </main>
</body>

</html>
